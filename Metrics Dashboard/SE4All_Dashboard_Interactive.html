function parseNumber(val) {
  if (val == null) return 0;
  const s = String(val).trim().replace(/,/g, '').replace(/\s/g, '');
  if (s === '' || s === '-' || s === '\u2013' || s === 'N/A' || s === 'n/a') return 0;
  const n = Number(s);
  return isNaN(n) ? 0 : n;
}

function isYes(val) {
  if (!val) return false;
  const s = String(val).trim().toLowerCase();
  const m = s.match(/^[a-z0-9]+/);
  const tok = m ? m[0] : '';
  return tok === 'y' || tok === 'yes' || tok === '1' || tok === 'true';
}

function classifyHeader(header) {
  const h = header.toLowerCase().trim();

  // Origin country
  if (h.includes('origin country') || h === 'origin') return { type: 'originCountry' };

  // Compact name
  if (h === 'compact' || h === 'registry name' || h === 'registry') return { type: 'registry' };
  if (h === 'compact id') return { type: 'compactId' };

  // One-hot proponent types (header starts with "proponent type")
  if (h.startsWith('proponent type')) {
    const name = header.replace(/^proponent type\s*/i, '').trim();
    return { type: 'proponentType', name: name || header };
  }

  // Coverage regions (header starts with "coverage region")
  if (h.startsWith('coverage region')) {
    const name = header.replace(/^coverage region\s*/i, '').trim();
    return { type: 'coverageRegion', name: name || header };
  }

  // Target year columns
  if (h.startsWith('target year')) {
    const rest = h.replace('target year', '').trim();
    for (const m of TARGET_YEAR_MAP) {
      if (rest.includes(m.match)) return { type: 'targetYear', metricIds: m.ids };
    }
    return null;
  }

  // Metric columns
  for (const m of METRIC_HEADER_MAP) {
    if (h.includes(m.match)) return { type: 'metric', id: m.id };
  }

  return null;
}

function parseCSVData(csvText) {
  const result = Papa.parse(csvText, { header: true, skipEmptyLines: true, dynamicTyping: false });
  if (!result.data || result.data.length === 0) throw new Error('No data rows found');
  const headers = result.meta.fields || [];

  // Classify all headers
  const columnMap = {};
  headers.forEach(h => {
    const cls = classifyHeader(h);
    if (cls) columnMap[h] = cls;
  });

  // Parse rows
  const compacts = result.data.map((row, i) => {
    const c = {
      id: i,
      registry: '',
      proponentTypes: [],
      coverageRegions: [],
      originCountry: '',
      metrics: {},
    };

    // Initialize metrics with value + targetYear
    METRICS.forEach(m => { c.metrics[m.id] = { value: 0, targetYear: null }; });

    Object.entries(columnMap).forEach(([header, cls]) => {
      const val = row[header];
      if (cls.type === 'registry') {
        c.registry = (val || '').trim();
      } else if (cls.type === 'originCountry') {
        c.originCountry = (val || '').trim();
      } else if (cls.type === 'proponentType') {
        if (isYes(val)) c.proponentTypes.push(cls.name);
      } else if (cls.type === 'coverageRegion') {
        if (isYes(val)) c.coverageRegions.push(cls.name);
      } else if (cls.type === 'metric') {
        if (cls.id === 'netzero_pledges') {
          c.metrics[cls.id].value = isYes(val) ? 1 : 0;
        } else {
          c.metrics[cls.id].value = parseNumber(val);
        }
      } else if (cls.type === 'targetYear') {
        const yr = parseInt(val);
        if (!isNaN(yr) && yr > 0) {
          cls.metricIds.forEach(mid => {
            if (c.metrics[mid]) c.metrics[mid].targetYear = yr;
          });
        }
      }
    });

    c._isGlobal = BASE_REGIONS.every(r => c.coverageRegions.includes(r));
    return c;
  }).filter(c => c.registry && c.registry.length > 0);

  // Discover unique proponent types
  const allPT = new Set();
  compacts.forEach(c => c.proponentTypes.forEach(pt => allPT.add(pt)));
  const proponentTypes = [...allPT].sort();
  const originCountries = [...new Set(compacts.map(c => c.originCountry).filter(c => c))].sort();

  return { compacts, proponentTypes, originCountries, rowCount: compacts.length };
}

let PROPONENT_TYPES = [], ORIGIN_COUNTRIES = [], COMPACTS = [];
function loadParsedData(p) {
  COMPACTS = p.compacts;
  PROPONENT_TYPES = p.proponentTypes;
  ORIGIN_COUNTRIES = p.originCountries || [];
  _regionResolveCache.clear();
  Object.assign(window, { PROPONENT_TYPES, ORIGIN_COUNTRIES, COMPACTS });
}

const COVERAGE_REGIONS = ['Global', 'Americas', 'Europe', 'Asia-Pacific', 'Africa'];
const BASE_REGIONS = ['Americas', 'Europe', 'Asia-Pacific', 'Africa'];
Object.assign(window, { COVERAGE_REGIONS, BASE_REGIONS });

// Resolve a country (origin) to one of the four base regions.
// 1. Try the static COUNTRY_TO_REGION table.
// 2. If not found, scan the data: find all compacts whose originCountry matches
//    and look at their per-region coverage flags. If exactly one of the four
//    base regions is marked yes across those rows, return it. Else null.
const _regionResolveCache = new Map();
function resolveCountryRegion(country, compactRows) {
  if (!country || country === 'All') return null;
  if (COUNTRY_TO_REGION[country]) return COUNTRY_TO_REGION[country];
  if (!Array.isArray(compactRows) || compactRows.length === 0) return null;
  if (_regionResolveCache.has(country)) return _regionResolveCache.get(country);
  const hits = new Set();
  for (const row of compactRows) {
    if (!row || row.originCountry !== country) continue;
    const cov = Array.isArray(row.coverageRegions) ? row.coverageRegions : [];
    for (const r of BASE_REGIONS) {
      if (cov.includes(r)) hits.add(r);
    }
  }
  const result = hits.size === 1 ? Array.from(hits)[0] : null;
  _regionResolveCache.set(country, result);
  return result;
}
Object.assign(window, { COUNTRY_TO_REGION, resolveCountryRegion });

function aggregate(compacts, filters) {
  const proponentSet = filters.proponentTypes && filters.proponentTypes.length
    ? new Set(filters.proponentTypes) : null;
  const regionSet = filters.coverageRegions && filters.coverageRegions.length
    ? new Set(filters.coverageRegions) : null;
  const wantsGlobal = regionSet ? regionSet.has('Global') : false;
  const originFilter = filters.originCountry && filters.originCountry !== 'All'
    ? filters.originCountry : null;

  const filtered = compacts.filter(c => {
    if (originFilter && c.originCountry !== originFilter) return false;
    if (proponentSet) {
      let hit = false;
      for (let i = 0; i < c.proponentTypes.length; i++) {
        if (proponentSet.has(c.proponentTypes[i])) { hit = true; break; }
      }
      if (!hit) return false;
    }
    if (regionSet) {
      if (wantsGlobal && c._isGlobal) {
        // matches via Global
      } else {
        let hit = false;
        for (let i = 0; i < c.coverageRegions.length; i++) {
          if (regionSet.has(c.coverageRegions[i])) { hit = true; break; }
        }
        if (!hit) return false;
      }
    }
    return true;
  });

  // Step 2: aggregate metrics, filtering each metric by its per-compact target year
  const targetYearCutoff = filters.targetYear || 9999;
  const totals = {};
  METRICS.forEach(m => { totals[m.id] = 0; });

  filtered.forEach(c => {
    METRICS.forEach(m => {
      const metricData = c.metrics[m.id];
      if (!metricData) return;
      const myTargetYear = metricData.targetYear;
      // Include metric value only if its target year <= slider value, or if no target year is set
      if (!myTargetYear || myTargetYear <= targetYearCutoff) {
        totals[m.id] += metricData.value || 0;
      }
    });
  });

  return { count: filtered.length, totals, filtered };
}

function formatValue(v, format) {
  if (v == null || isNaN(v)) return '\u2013';
  if (v === 0) return '0';
  if (format === 'currency') {
    if (v >= 1e12) return `$${(v / 1e12).toFixed(1)}T`;
    if (v >= 1e9) return `$${(v / 1e9).toFixed(1)}B`;
    if (v >= 1e6) return `$${(v / 1e6).toFixed(1)}M`;
    if (v >= 1e3) return `$${(v / 1e3).toFixed(1)}K`;
    return `$${v.toFixed(0)}`;
  }
  if (format === 'decimal') {
    if (v >= 1000) return v.toFixed(0);
    if (v >= 100) return v.toFixed(1);
    return v.toFixed(2);
  }
  if (v >= 1e6) return `${(v / 1e6).toFixed(1)}M`;
  if (v >= 1e3) return `${(v / 1e3).toFixed(1)}K`;
  return Math.round(v).toLocaleString('en-US');
}

function useAnimatedNumber(target, duration = 600) {
  const [value, setValue] = React.useState(target);
  const fromRef = React.useRef(target);
  const startRef = React.useRef(0);
  const rafRef = React.useRef(0);
  React.useEffect(() => {
    cancelAnimationFrame(rafRef.current);
    if (Math.abs(target - value) < 0.01) {
      if (value !== target) setValue(target);
      return;
    }
    fromRef.current = value;
    startRef.current = performance.now();
    const step = (now) => {
      const t = Math.min(1, (now - startRef.current) / duration);
      const u = 1 - t;
      const eased = 1 - u * u * u;
      const next = fromRef.current + (target - fromRef.current) * eased;
      setValue(next);
      if (t < 1) rafRef.current = requestAnimationFrame(step);
    };
    rafRef.current = requestAnimationFrame(step);
    return () => cancelAnimationFrame(rafRef.current);
  }, [target]);
  return value;
}


Object.assign(window, { METRICS, aggregate, formatValue, useAnimatedNumber });

};

// Cache the parsed SVG paths globally so we only fetch once.
let _svgCache = null;
let _svgPromise = null;
function loadWorldMapSVG() {
  if (_svgCache) return Promise.resolve(_svgCache);
  if (_svgPromise) return _svgPromise;
  _svgPromise = fetch((window.__resources && window.__resources.worldMapSvg) || SVG_CDN_URL).
  then((r) => r.text()).
  then((text) => {
    const doc = new DOMParser().parseFromString(text, 'image/svg+xml');
    const svg = doc.documentElement;
    const viewBox = svg.getAttribute('viewBox') || '0 0 1000 500';
    // Gather entries: each is { id, ds: [d, d, ...] }
    // - <g id="xx"> with multiple <path>s (countries with islands: us, gb, ca, jp, fr, ...)
    // - bare <path id="xx"> for single-shape countries (ae, af, al, ...)
    const entries = [];
    Array.from(svg.querySelectorAll('g[id]')).forEach((g) => {
      const rawId = g.getAttribute('id') || '';
      const id = rawId.toLowerCase();
      const ds = Array.from(g.querySelectorAll('path')).map((p) => p.getAttribute('d')).filter(Boolean);
      if (id && ds.length) entries.push({ id, isoUpper: rawId.toUpperCase(), ds });
    });
    Array.from(svg.querySelectorAll('path[id]')).forEach((p) => {
      // Skip paths inside a g[id] (already covered)
      if (p.parentElement && p.parentElement.tagName.toLowerCase() === 'g' && p.parentElement.getAttribute('id')) return;
      const rawId = p.getAttribute('id') || '';
      const id = rawId.toLowerCase();
      const d = p.getAttribute('d') || '';
      if (id && d) entries.push({ id, isoUpper: rawId.toUpperCase(), ds: [d] });
    });
    _svgCache = { viewBox, entries };
    return _svgCache;
  });
  return _svgPromise;
}

function useWorldMapSVG() {
  const [data, setData] = React.useState(_svgCache);
  React.useEffect(() => {
    if (!data) loadWorldMapSVG().then(setData).catch(() => {});
  }, []);
  return data;
}

const WorldMap = React.memo(function WorldMap({
  activeRegions = [],
  selectedCountry = 'All',
  countriesInRegions = {},
  onRegionClick,
  theme = 'light'
}) {
  const data = useWorldMapSVG();
  const isDark = theme === 'dark';
  const mutedFill = isDark ? '#22324f' : '#e9ebf0';

  const activeSet = React.useMemo(() => {
    const s = new Set(activeRegions);
    if (selectedCountry !== 'All') {
      for (const region in countriesInRegions) {
        const set = countriesInRegions[region];
        if (set && set.has && set.has(selectedCountry)) s.add(region);
      }
    }
    return s;
  }, [activeRegions, selectedCountry, countriesInRegions]);

  const anyActive = activeSet.size > 0 || selectedCountry !== 'All';

  const presentISOs = React.useMemo(() => {
    const s = new Set();
    for (const region in countriesInRegions) {
      const set = countriesInRegions[region];
      if (!set || !set.forEach) continue;
      set.forEach((country) => {
        const iso = COUNTRY_TO_ISO[country];
        if (iso) s.add(iso.toLowerCase());
      });
    }
    return s;
  }, [countriesInRegions]);

  const handleClick = React.useCallback((region) => {
    if (region && onRegionClick) onRegionClick(region);
  }, [onRegionClick]);

  if (!data) {
    return (
      <div style={{
        width: '100%', height: '100%',
        display: 'flex', alignItems: 'center', justifyContent: 'center',
        color: isDark ? '#6b7896' : '#aab0b8', fontSize: 11,
        fontFamily: '"IBM Plex Mono", monospace'
      }}>loading map…</div>);
  }

  return (
    <svg viewBox={data.viewBox} style={{ width: '100%', height: '100%', display: 'block' }}>
      {data.entries.map(({ id, isoUpper, ds }) => {
        const region = ISO_REGION[isoUpper];

        let fill;
        if (!region) fill = mutedFill;
        else if (!anyActive) fill = REGION_COLORS_DEFAULT[region];
        else if (activeSet.has(region)) fill = REGION_COLORS_ACTIVE[region];
        else fill = mutedFill;

        return (
          <g
            key={id}
            data-region={region || ''}
            style={{ cursor: onRegionClick && region ? 'pointer' : 'default' }}
            onClick={region ? () => handleClick(region) : undefined}>
            {ds.map((d, i) =>
              <path
                key={i}
                d={d}
                fill={fill}
                stroke={fill}
                strokeWidth={1.5}
                strokeLinejoin="round" />
            )}
          </g>);
      })}
    </svg>);
});

function countriesByRegionFromCompacts(compacts) {
  const out = { 'Africa': new Set(), 'Americas': new Set(), 'Asia-Pacific': new Set(), 'Europe': new Set() };
  compacts.forEach((c) => {
    if (!out[c.region]) out[c.region] = new Set();
    out[c.region].add(c.country);
  });
  return out;
}

Object.assign(window, { WorldMap, COUNTRY_COORDS, COUNTRY_TO_ISO, ISO_REGION, countriesByRegionFromCompacts });

              <div style={{ flex: 1, height: 1, background: V6_T.border }}></div>

            <div style={{ display: 'grid', gridTemplateColumns: '1fr', gap: 1, flex: 1,

function formatDateForDisplay(isoDate) {
  if (!isoDate) return '';
  const d = new Date(isoDate + 'T00:00:00');
  const months = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  return `${d.getDate()} ${months[d.getMonth()]} ${d.getFullYear()}`;
}

function UploadScreen({ onDataLoaded }) {
  const [dragOver, setDragOver] = React.useState(false);
  const [error, setError] = React.useState(null);
  const [parsing, setParsing] = React.useState(false);
  const [dataDate, setDataDate] = React.useState('');
  const [pendingParsed, setPendingParsed] = React.useState(null);
  const fileRef = React.useRef(null);

  const handleFile = (file) => {
    if (!file) return;
    setError(null); setParsing(true);
    const isExcel = file.name.match(/\.xlsx?$/i);
    if (isExcel) {
      const reader = new FileReader();
      reader.onload = (e) => {
        try {
          const wb = XLSX.read(new Uint8Array(e.target.result), { type: 'array' });
          const csv = XLSX.utils.sheet_to_csv(wb.Sheets[wb.SheetNames[0]]);
          const parsed = parseCSVData(csv);
          if (parsed.rowCount === 0) { setError('No valid data rows found.'); setParsing(false); return; }
          setPendingParsed(parsed); setParsing(false);
        } catch (err) { setError(`Error parsing Excel: ${err.message}`); setParsing(false); }
      };
      reader.onerror = () => { setError('Failed to read file'); setParsing(false); };
      reader.readAsArrayBuffer(file);
    } else {
      const reader = new FileReader();
      reader.onload = (e) => {
        try {
          const parsed = parseCSVData(e.target.result);
          if (parsed.rowCount === 0) { setError('No valid data rows found.'); setParsing(false); return; }
          setPendingParsed(parsed); setParsing(false);
        } catch (err) { setError(`Error parsing CSV: ${err.message}`); setParsing(false); }
      };
      reader.onerror = () => { setError('Failed to read file'); setParsing(false); };
      reader.readAsText(file);
    }
  };

  const handleSubmit = () => {
    if (!pendingParsed) return;
    if (!dataDate) { setError('Please select the date when this data was last updated.'); return; }
    loadParsedData(pendingParsed);
    window.__dataDate = formatDateForDisplay(dataDate);
    onDataLoaded(pendingParsed);
  };

  const onDrop = (e) => {
    e.preventDefault(); setDragOver(false);
    const file = e.dataTransfer.files[0];
    if (file && (file.name.match(/\.csv$/i) || file.name.match(/\.xlsx?$/i) || file.type === 'text/csv')) handleFile(file);
    else setError('Please upload a .csv or .xlsx file');
  };

  return (
    <div style={{
      width: '100vw', height: '100vh', display: 'flex', alignItems: 'center', justifyContent: 'center',
      background: '#f7f8fa',
      backgroundImage: 'radial-gradient(ellipse 900px 500px at 50% 30%, rgba(26,58,110,0.06), transparent)',
    }}>
      <div style={{ textAlign: 'center', maxWidth: 560, padding: '0 24px' }}>
        <div style={{ fontSize: 11, fontWeight: 600, letterSpacing: 1.4, color: '#e89923', marginBottom: 12, fontFamily: '"DM Sans", sans-serif', textTransform: 'uppercase' }}>Energy Compacts Registry</div>
        <h1 style={{ margin: '0 0 10px', fontSize: 32, fontWeight: 700, letterSpacing: -0.8, color: '#0f2347', lineHeight: 1.15, fontFamily: '"DM Sans", sans-serif' }}>Energy Compacts Metrics Dashboard</h1>
        <p style={{ fontSize: 14, color: '#6b7383', lineHeight: 1.6, margin: '0 0 32px', fontFamily: '"DM Sans", sans-serif' }}>
          Drop a CSV or Excel file with energy compact data to populate the dashboard.
        </p>
        <div onDragOver={(e) => { e.preventDefault(); setDragOver(true); }} onDragLeave={() => setDragOver(false)} onDrop={onDrop}
          onClick={() => !pendingParsed && fileRef.current?.click()}
          style={{
            border: `2px dashed ${pendingParsed ? '#bbf7d0' : dragOver ? '#1a3a6e' : '#d0d5de'}`,
            borderRadius: 8, padding: pendingParsed ? '20px 32px' : '48px 32px',
            cursor: pendingParsed ? 'default' : 'pointer',
            background: pendingParsed ? '#f0fdf4' : dragOver ? 'rgba(26,58,110,0.04)' : '#fff',
            transition: 'all 0.2s', textAlign: 'left',
          }}>
          {parsing ? (
            <div style={{ textAlign: 'center' }}>
              <div style={{ width: 36, height: 36, border: '3px solid #e4e7ee', borderTopColor: '#1a3a6e', borderRadius: '50%', margin: '0 auto 16px', animation: 'spin 0.8s linear infinite' }} />
              <div style={{ fontSize: 14, color: '#1a3a6e', fontWeight: 500 }}>Parsing data…</div>
            </div>
          ) : pendingParsed ? (
            <div>
              <div style={{ display: 'flex', alignItems: 'center', gap: 10, marginBottom: 6 }}>
                <span style={{ width: 22, height: 22, borderRadius: '50%', background: '#22c55e', display: 'inline-flex', alignItems: 'center', justifyContent: 'center', color: '#fff', fontSize: 12, fontWeight: 700, flexShrink: 0 }}>✓</span>
                <span style={{ fontSize: 14, color: '#166534', fontWeight: 600 }}>{pendingParsed.rowCount} compacts loaded</span>
              </div>
              <div style={{ fontSize: 12, color: '#15803d', marginLeft: 32, marginBottom: 20 }}>
                {pendingParsed.proponentTypes.length} proponent types
              </div>
              <div style={{ marginBottom: 18 }}>
                <label style={{ display: 'block', fontSize: 13, fontWeight: 600, color: '#1a1d24', marginBottom: 8 }}>When was this data last updated?</label>
                <input type="date" value={dataDate} onChange={(e) => { setDataDate(e.target.value); setError(null); }}
                  style={{ width: '100%', padding: '11px 14px', border: `1.5px solid ${error && !dataDate ? '#fca5a5' : '#d0d5de'}`, borderRadius: 6, fontSize: 14, fontFamily: 'inherit', outline: 'none', background: '#fff', color: dataDate ? '#1a1d24' : '#9aa2b0', cursor: 'pointer' }}
                  onFocus={(e) => e.target.style.borderColor = '#1a3a6e'} onBlur={(e) => e.target.style.borderColor = error && !dataDate ? '#fca5a5' : '#d0d5de'} />
              </div>
              <button onClick={handleSubmit} style={{ width: '100%', padding: '13px 20px', background: '#1a3a6e', color: '#fff', border: 'none', borderRadius: 6, fontSize: 14, fontWeight: 600, cursor: 'pointer', fontFamily: '"Open Sans", sans-serif' }}
                onMouseOver={(e) => e.target.style.background = '#0f2347'} onMouseOut={(e) => e.target.style.background = '#1a3a6e'}>Launch Dashboard →</button>
              <button onClick={() => { setPendingParsed(null); setDataDate(''); setError(null); }} style={{ width: '100%', padding: '10px 20px', marginTop: 8, background: 'transparent', color: '#6b7383', border: '1px solid #e4e7ee', borderRadius: 6, fontSize: 13, fontWeight: 500, cursor: 'pointer', fontFamily: 'inherit' }}>Choose a different file</button>
            </div>
          ) : (
            <div style={{ textAlign: 'center' }}>
              <div style={{ fontSize: 36, marginBottom: 12, opacity: 0.3 }}>📄</div>
              <div style={{ fontSize: 15, color: '#1a1d24', fontWeight: 500, marginBottom: 6 }}>Drop your CSV or Excel file here</div>
              <div style={{ fontSize: 13, color: '#9aa2b0' }}>or click to browse</div>
            </div>
          )}
        </div>
        <input ref={fileRef} type="file" accept=".csv,.xlsx,.xls" onChange={(e) => handleFile(e.target.files[0])} style={{ display: 'none' }} />
        {error && (<div style={{ marginTop: 16, padding: '12px 16px', background: '#fef2f2', border: '1px solid #fecaca', borderRadius: 6, fontSize: 13, color: '#991b1b', textAlign: 'left' }}>{error}</div>)}
        <div style={{ marginTop: 32, fontSize: 11, color: '#b0b5be', display: 'flex', gap: 20, justifyContent: 'center' }}>
          <span>CSV & Excel</span><span>·</span><span>Auto-detects columns</span><span>·</span><span>All processing is local</span>
        </div>
      </div>
      <style>{`@keyframes spin { to { transform: rotate(360deg); } }`}</style>
    </div>
  );
}

function exportDashboardHTML(variation) {
  const scriptEl = document.querySelector('script[type="text/babel"]');
  const fullCode = scriptEl.textContent;

  const metricsStart = fullCode.indexOf('const METRICS =');
  const csvStart = fullCode.indexOf('// CSV');
  const coverageStart = fullCode.indexOf('const COVERAGE_REGIONS');
  const mapComment = fullCode.indexOf('// WORLD MAP');
  const mapCodeStart = fullCode.indexOf('const SVG_CDN_URL') !== -1 ? fullCode.indexOf('const SVG_CDN_URL') : fullCode.indexOf('// Shared WorldMap');
  // V6 deps include V1_T, V1_FilterDropdown/CheckboxList/SelectDropdown and V3_ICONS/V4_ICONS.
  // They start at the V1_T block (a comment line above) and end where the V6 dashboard begins.
  const depsStart = fullCode.indexOf('const V1_T = {');
  const v6HeaderStart = fullCode.indexOf('// DASHBOARD V1 (V6 — Light, SE4All branding)');
  const v6BorderStart = fullCode.lastIndexOf('// ═══════════════════════════════════════════════════════════', v6HeaderStart);
  const v6End = fullCode.indexOf('Object.assign(window, { V6_Dashboard });') + 'Object.assign(window, { V6_Dashboard });'.length;

  const metricsBlock = fullCode.substring(metricsStart, csvStart).trim();
  const aggBlock = fullCode.substring(coverageStart, mapComment).trim();
  const mapBlock = fullCode.substring(mapCodeStart, depsStart).trim();
  const depsBlock = fullCode.substring(depsStart, v6BorderStart).trim();
  const varBlock = fullCode.substring(v6BorderStart, v6End).trim();

  let dashComponent, bgColor, mountExtra;
  if (variation === 'V1') {
    dashComponent = 'V6_Dashboard'; bgColor = '#ffffff'; mountExtra = '';
  } else {
    dashComponent = 'V6_Dashboard'; bgColor = '#0d1b2a'; mountExtra = 'setV6Theme(true);\n';
  }

  const dateStr = window.__dataDate || '';
  const dataBlock = `
const PROPONENT_TYPES = ${JSON.stringify(PROPONENT_TYPES)};
const COMPACTS = ${JSON.stringify(COMPACTS)};
window.__dataDate = ${JSON.stringify(dateStr)};
`;

  const mountBlock = `
${mountExtra}Object.assign(window, {
  PROPONENT_TYPES, COMPACTS, COVERAGE_REGIONS,
  METRICS, aggregate, formatValue, useAnimatedNumber,
});
const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<${dashComponent} />);
`;

  const exportHTML = `<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Energy Compacts Metrics Dashboard (${variation === 'V1' ? 'UN Energy Website Theme' : 'SEforAll Website Theme'})</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=DM+Sans:wght@400;500;600;700&family=IBM+Plex+Sans:wght@300;400;500;600;700&family=IBM+Plex+Serif:ital,wght@0,300;0,400;0,500;1,400&family=Oswald:wght@300;400;500;600;700&family=Open+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    html, body { margin: 0; padding: 0; height: 100%; background: ${bgColor}; }
    body { font-family: "Open Sans", -apple-system, sans-serif; }
    * { box-sizing: border-box; }
    ::-webkit-scrollbar { width: 8px; height: 8px; }
    ::-webkit-scrollbar-thumb { background: rgba(0,0,0,0.2); border-radius: 4px; }
  </style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js" crossorigin="anonymous"><\/script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js" crossorigin="anonymous"><\/script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.26.10/babel.min.js" crossorigin="anonymous"><\/script>
<\/head>
<body>
  <div id="root"><\/div>
  <script type="text/babel" data-presets="react">
${metricsBlock}

${dataBlock}

${aggBlock}

${mapBlock}

${depsBlock}

${varBlock}

${mountBlock}
  <\/script>
<\/body>
<\/html>`;

  const blob = new Blob([exportHTML], { type: 'text/html' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  const themeLabel = variation === 'V1' ? 'UN_Energy_Theme' : 'SEforAll_Theme';
  a.href = url; a.download = `SE4All_Dashboard_${themeLabel}.html`;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

// ═══════════════════════════════════════════════════════════
// APP
// ═══════════════════════════════════════════════════════════

function App() {
  const [data, setData] = React.useState(null);
  const [variation, setVariation] = React.useState('V1');

  if (!data) {
    document.body.style.background = '#f7f8fa';
    return <UploadScreen onDataLoaded={(p) => setData(p)} />;
  }

  const isDark = variation === 'V2';
  setV6Theme(isDark);
  document.body.style.background = isDark ? '#0d1b2a' : '#ffffff';

  return (
    <div style={{ width: '100%', minHeight: '100vh' }}>
      <V6_Dashboard key={variation} />
      <Toolbar variation={variation} onChange={setVariation}
        onReset={() => { setData(null); window.__dataDate = ''; setV6Theme(false); document.body.style.background = '#fff'; }}
        onExport={() => exportDashboardHTML(variation)} />
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App />);
  </script>
</body>
</html>
